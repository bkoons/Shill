<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Obsidian Space Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sovereign Neon Dialectic Gradient -->
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Eye Visor Glowing Cyan Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container badge with dark obsidian plate & cyber border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Antenna Base & Orb (matches 🤖 emoji) -->
  <line x1="32" y1="9" x2="32" y2="17" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="8" r="3" fill="#00f5ff" filter="url(#neonGlow)" />

  <!-- Robot Head Frame -->
  <rect x="13" y="17" width="38" height="32" rx="7" fill="#1e293b" stroke="url(#robotGrad)" stroke-width="2.5" />

  <!-- Left & Right Ear Bolt Radios -->
  <rect x="9" y="27" width="4" height="12" rx="2" fill="#38bdf8" />
  <rect x="51" y="27" width="4" height="12" rx="2" fill="#818cf8" />

  <!-- Eyes / Luminous Visor Display -->
  <circle cx="24" cy="29" r="4.5" fill="url(#eyeGrad)" filter="url(#neonGlow)" />
  <circle cx="40" cy="29" r="4.5" fill="url(#eyeGrad)" filter="url(#neonGlow)" />
  <circle cx="25.5" cy="27.5" r="1.5" fill="#ffffff" />
  <circle cx="41.5" cy="27.5" r="1.5" fill="#ffffff" />

  <!-- Friendly Dialectic Speaker Grille / Mouth -->
  <rect x="22" y="39" width="20" height="4.5" rx="2.2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <line x1="27" y1="39" x2="27" y2="43.5" stroke="#38bdf8" stroke-width="1" />
  <line x1="32" y1="39" x2="32" y2="43.5" stroke="#38bdf8" stroke-width="1" />
  <line x1="37" y1="39" x2="37" y2="43.5" stroke="#38bdf8" stroke-width="1" />

  <!-- Cryptographic Pulse Dots beneath mouth -->
  <circle cx="26" cy="47" r="1" fill="#38bdf8" opacity="0.7" />
  <circle cx="32" cy="47" r="1" fill="#00f5ff" opacity="0.9" />
  <circle cx="38" cy="47" r="1" fill="#818cf8" opacity="0.7" />
</svg>
