<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep obsidian space background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon sovereign cyan-to-purple dialectic gradient -->
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- TON diamond facet gradients -->
    <linearGradient id="tonGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0098ea" />
    </linearGradient>
    <linearGradient id="tonGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0098ea" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Subtle neon outer glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container rounded badge with cryptographic border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle ambient core pulse -->
  <circle cx="32" cy="32" r="22" fill="url(#corePulse)" />

  <!-- Outer Neural Hexagon / P2P UDP Mesh Ring -->
  <!-- Top: 32, 10 | Top-Right: 50, 20 | Bottom-Right: 50, 44 | Bottom: 32, 54 | Bottom-Left: 14, 44 | Top-Left: 14, 20 -->
  <polygon points="32,10 50,20 50,44 32,54 14,44 14,20" 
           fill="none" 
           stroke="url(#meshGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round" 
           filter="url(#neonGlow)" />

  <!-- Internal Cross-Dialectic Synapse Rays to Center -->
  <line x1="32" y1="10" x2="32" y2="24" stroke="#00f5ff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="20" x2="38" y2="28" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="44" x2="38" y2="36" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="32" y1="54" x2="32" y2="40" stroke="#d946ef" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="14" y1="44" x2="26" y2="36" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="14" y1="20" x2="26" y2="28" stroke="#00f5ff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- The 5 Peer Bot Swarm Node Orbitals (Solon, Lyra, Kael, Athena, Milo) + 6th routing peer -->
  <circle cx="32" cy="10" r="3.2" fill="#00f5ff" />
  <circle cx="50" cy="20" r="3.2" fill="#38bdf8" />
  <circle cx="50" cy="44" r="3.2" fill="#8b5cf6" />
  <circle cx="32" cy="54" r="3.2" fill="#d946ef" />
  <circle cx="14" cy="44" r="3.2" fill="#8b5cf6" />
  <circle cx="14" cy="20" r="3.2" fill="#00f5ff" />

  <!-- Central Sovereign TON Diamond / Cryptographic Mind Nucleus -->
  <!-- Top Apex: 32, 24 | Right: 40, 32 | Bottom: 32, 40 | Left: 24, 32 -->
  <g filter="url(#neonGlow)">
    <!-- Top-Left Facet -->
    <polygon points="32,23 24,31 32,33" fill="#7dd3fc" />
    <!-- Top-Right Facet -->
    <polygon points="32,23 40,31 32,33" fill="url(#tonGradTop)" />
    <!-- Bottom-Left Facet -->
    <polygon points="24,31 32,41 32,33" fill="url(#tonGradBottom)" />
    <!-- Bottom-Right Facet -->
    <polygon points="40,31 32,41 32,33" fill="#0284c7" />
  </g>
</svg>
