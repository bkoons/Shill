[project]
name = "shill"
version = "0.2.0"
description = "Sovereign Autonomous P2P Bot Mesh & AMM DEX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "textstat>=0.7.0",
    "pytest>=7.0.0",
    "pyotp>=2.8.0",
    "tonsdk>=1.0.14",
    "pynacl>=1.5.0",
    "ecdsa>=0.18.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
