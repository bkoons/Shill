name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    env:
      SHILL_ROOT_PASSWORD: ci-test-password-not-secret
      SHILL_TOTP_SECRET: JBSWY3DPEHPK3PXP
      SHILL_VAULT_PASSPHRASE: ci-vault-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest backend/tests -q
        env:
          PYTHONPATH: .
      - name: Import app (smoke)
        run: python -c "from backend.main import app; print('app import ok, routes:', len(app.routes))"
        env:
          PYTHONPATH: .
