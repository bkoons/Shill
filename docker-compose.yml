services:
  shill:
    build: .
    container_name: shill-node
    ports:
      - "8000:8000"
      - "9999:9999/udp"
    env_file:
      - .env
    volumes:
      - shill-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shill-data:
